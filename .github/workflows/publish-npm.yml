name: Publish DobroDesk npm packages

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: dobrodesk-npm-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.repository == 'comstud-io/dobrodesk-mobile-sdk' && vars.DOBRODESK_NPM_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install the npm trusted-publishing CLI
        timeout-minutes: 3
        run: npm install --global npm@11.5.1

      - name: Verify and download the exact published assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EXPECTED_REPOSITORY: "comstud-io/dobrodesk-mobile-sdk"
          EXPECTED_REPOSITORY_URL: "https://github.com/comstud-io/dobrodesk-mobile-sdk"
          NPM_REGISTRY: "https://registry.npmjs.org"
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          tag="$RELEASE_TAG"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          version="${tag#v}"
          jq -e --arg version "$version" --arg tag "$tag" \
            '.publication == "prepared" and .sdkVersion == $version and .tag == $tag' \
            publication-manifest.json >/dev/null
          assets=()
          while IFS= read -r asset; do
            [[ -n "$asset" ]] && assets+=("$asset")
          done < <(jq -r '.assets[] | select(.kind == "npm") | .name' publication-manifest.json | sort)
          expected_packages='["@dobrodesk/mobile-protocol","@dobrodesk/react-native-sdk","@dobrodesk/nativescript-sdk","@dobrodesk/capacitor-sdk"]'
          test "${#assets[@]}" = "$(jq 'length' <<<"$expected_packages")"
          temporary_root="$(mktemp -d)"
          trap 'rm -rf "$temporary_root"' EXIT
          for asset in "${assets[@]}"; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$temporary_root"
            test -f "$temporary_root/$asset"
            expected_sha="$(jq -er --arg path "assets/$asset" '.assets[] | select(.kind == "npm" and .path == $path) | .sha256' publication-manifest.json)"
            actual_sha="$(sha256sum "$temporary_root/$asset" | awk '{print $1}')"
            test "$actual_sha" = "$expected_sha"
          done

          package_assets="$temporary_root/package-assets.tsv"
          : >"$package_assets"
          for asset in "${assets[@]}"; do
            package_json="$temporary_root/$asset.package.json"
            tar -xOzf "$temporary_root/$asset" package/package.json >"$package_json"
            package_name="$(jq -er '.name' "$package_json")"
            package_version="$(jq -er '.version' "$package_json")"
            repository_url="$(jq -er '.repository.url' "$package_json")"
            package_license="$(jq -er '.license' "$package_json")"
            test "$package_version" = "$version"
            test "$repository_url" = "$EXPECTED_REPOSITORY_URL"
            test "$package_license" = "SEE LICENSE IN LICENSE"
            test "$(jq -r '.private // false' "$package_json")" != "true"
            tar -tzf "$temporary_root/$asset" package/LICENSE >/dev/null
            if awk -F '\t' -v name="$package_name" '$1 == name { found++ } END { exit found == 0 }' "$package_assets"; then
              echo "Duplicate npm package asset: $package_name" >&2
              exit 1
            fi
            printf '%s\t%s\n' "$package_name" "$asset" >>"$package_assets"
          done

          expected_package_names=(
            "@dobrodesk/mobile-protocol"
            "@dobrodesk/react-native-sdk"
            "@dobrodesk/nativescript-sdk"
            "@dobrodesk/capacitor-sdk"
          )
          for package_name in "${expected_package_names[@]}"; do
            asset="$(awk -F '\t' -v name="$package_name" '$1 == name { found++; value=$2 } END { if (found != 1) exit 1; print value }' "$package_assets")"
            test -n "$asset"
            view_output="$temporary_root/npm-view.json"
            view_error="$temporary_root/npm-view.error"
            set +e
            npm view "$package_name@$version" version --json --registry "$NPM_REGISTRY" >"$view_output" 2>"$view_error"
            view_exit=$?
            set -e
            if [[ $view_exit -eq 0 ]]; then
              existing="$(jq -er 'if type == "string" then . else error("npm view returned no exact version") end' "$view_output")"
              test "$existing" = "$version"
              registry_root="$temporary_root/npm-existing"
              mkdir "$registry_root"
              pack_json="$(npm pack "$package_name@$version" --json --pack-destination "$registry_root" --registry "$NPM_REGISTRY")"
              registry_tarball="$(jq -er 'if length == 1 then .[0].filename else error("npm pack returned multiple archives") end' <<<"$pack_json")"
              cmp --silent "$temporary_root/$asset" "$registry_root/$registry_tarball"
              continue
            fi
            if ! grep -Eq 'E404|404 Not Found' "$view_error" "$view_output"; then
              cat "$view_output" "$view_error" >&2
              exit $view_exit
            fi
            npm publish "$temporary_root/$asset" --access public --registry "$NPM_REGISTRY"
          done
