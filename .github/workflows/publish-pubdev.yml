name: Publish DobroDesk Flutter package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag to verify"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: dobrodesk-pubdev-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.repository == 'comstud-io/dobrodesk-mobile-sdk' && vars.DOBRODESK_PUBDEV_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pub.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - uses: subosito/flutter-action@v2
        if: ${{ github.event_name == 'push' }}
        with:
          flutter-version: "3.44.2"
          cache: true
          pub-cache: true

      - uses: dart-lang/setup-dart@v1
        if: ${{ github.event_name == 'push' }}

      - name: Verify and download the exact published bundle
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: "comstud-io/dobrodesk-mobile-sdk"
          EXPECTED_REPOSITORY_URL: "https://github.com/comstud-io/dobrodesk-mobile-sdk"
          EXPECTED_PACKAGE: "dobrodesk_sdk"
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          PUBLISH_ALLOWED: ${{ github.event_name == 'push' }}
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          tag="$RELEASE_TAG"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          version="${tag#v}"
          jq -e --arg version "$version" --arg tag "$tag" \
            '.publication == "prepared" and .sdkVersion == $version and .tag == $tag' \
            publication-manifest.json >/dev/null
          bundle_name="$(jq -er '[.assets[] | select(.kind == "bundle") | .name] | if length == 1 then .[0] else error("expected one bundle asset") end' publication-manifest.json)"
          expected_sha="$(jq -er --arg path "assets/$bundle_name" '.assets[] | select(.kind == "bundle" and .path == $path) | .sha256' publication-manifest.json)"
          temporary_root="$(mktemp -d)"
          trap 'rm -rf "$temporary_root"' EXIT
          downloaded="$temporary_root/$bundle_name"
          for attempt in $(seq 1 60); do
            is_draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)"
            if [[ "$is_draft" = "false" ]] && gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$bundle_name" --dir "$temporary_root" >/dev/null 2>&1; then
              break
            fi
            rm -f "$downloaded"
            sleep 10
          done
          test -f "$downloaded"
          actual_sha="$(sha256sum "$downloaded" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"
          extract_root="$temporary_root/extracted"
          mkdir "$extract_root"
          tar --exclude='._*' --exclude='*/._*' -xzf "$downloaded" -C "$extract_root"
          flutter_root="$extract_root/wrappers/packages/flutter"
          test -f "$flutter_root/pubspec.yaml"
          test "$(awk -F': *' '$1 == "name" { print $2; exit }' "$flutter_root/pubspec.yaml")" = "$EXPECTED_PACKAGE"
          test "$(awk -F': *' '$1 == "version" { print $2; exit }' "$flutter_root/pubspec.yaml")" = "$version"
          test "$(sed -n 's/^repository:[[:space:]]*//p' "$flutter_root/pubspec.yaml" | head -n 1)" = "$EXPECTED_REPOSITORY_URL"
          ! grep -q '^publish_to:[[:space:]]*none' "$flutter_root/pubspec.yaml"
          cd "$flutter_root"
          api_body="$temporary_root/pubdev-package.json"
          api_error="$temporary_root/pubdev-api.error"
          set +e
          api_status="$(curl --connect-timeout 15 --max-time 60 --silent --show-error --output "$api_body" --write-out '%{http_code}' "https://pub.dev/api/packages/$EXPECTED_PACKAGE" 2>"$api_error")"
          api_exit=$?
          set -e
          if [[ $api_exit -ne 0 ]]; then
            cat "$api_error" >&2
            exit $api_exit
          fi
          if [[ "$api_status" = "404" ]]; then
            if [[ "$PUBLISH_ALLOWED" != "true" ]]; then
              echo "Manual pub.dev dispatch is verification-only; package $EXPECTED_PACKAGE@$version is not published." >&2
              exit 1
            fi
            flutter pub publish --force
            exit 0
          fi
          test "$api_status" = "200"
          published_version_count="$(jq -er --arg version "$version" '[.versions[] | select(.version == $version)] | length' "$api_body")"
          case "$published_version_count" in
            0)
              if [[ "$PUBLISH_ALLOWED" != "true" ]]; then
                echo "Manual pub.dev dispatch is verification-only; package $EXPECTED_PACKAGE@$version is not published." >&2
                exit 1
              fi
              flutter pub publish --force
              exit 0
              ;;
            1)
              archive_url="$(jq -er --arg version "$version" '[.versions[] | select(.version == $version)] | .[0].archive_url' "$api_body")"
              archive_sha="$(jq -er --arg version "$version" '[.versions[] | select(.version == $version)] | .[0].archive_sha256' "$api_body")"
              ;;
            *)
              echo "pub.dev API returned duplicate entries for version $version." >&2
              exit 1
              ;;
          esac
          [[ "$archive_url" =~ ^https://pub\.dev/ ]]
          [[ "$archive_sha" =~ ^[a-f0-9]{64}$ ]]
          existing_archive="$temporary_root/pubdev-existing.tar.gz"
          curl --connect-timeout 15 --max-time 120 --fail --silent --show-error --location "$archive_url" --output "$existing_archive"
          actual_archive_sha="$(sha256sum "$existing_archive" | awk '{print $1}')"
          test "$actual_archive_sha" = "$archive_sha"
          local_manifest="$temporary_root/pubdev-local.manifest"
          remote_root="$temporary_root/pubdev-existing"
          mkdir "$remote_root"
          archive_entries="$temporary_root/pubdev-existing.entries"
          if ! tar -tzf "$existing_archive" >"$archive_entries"; then
            echo "pub.dev archive listing failed." >&2
            exit 1
          fi
          while IFS= read -r archive_entry; do
            archive_path="${archive_entry#./}"
            if [[ "$archive_path" = /* ]]; then
              echo "pub.dev archive contains an absolute path: $archive_entry" >&2
              exit 1
            fi
            if [[
              "$archive_path" = ".." ||
              "$archive_path" = ../* ||
              "$archive_path" = */../* ||
              "$archive_path" = */..
            ]]; then
              echo "pub.dev archive contains a parent path: $archive_entry" >&2
              exit 1
            fi
          done <"$archive_entries"
          archive_metadata="$temporary_root/pubdev-existing.metadata"
          if ! tar -tvzf "$existing_archive" >"$archive_metadata"; then
            echo "pub.dev archive metadata listing failed." >&2
            exit 1
          fi
          while IFS= read -r archive_metadata_line; do
            archive_type="${archive_metadata_line:0:1}"
            if [[ "$archive_type" = "l" || "$archive_type" = "h" ]]; then
              echo "pub.dev archive contains a symbolic or hard link." >&2
              exit 1
            fi
          done <"$archive_metadata"
          tar --exclude='._*' --exclude='*/._*' -xzf "$existing_archive" -C "$remote_root"
          remote_manifest="$temporary_root/pubdev-remote.manifest"
          canonical_manifest() {
            local root="$1"
            local output="$2"
            (cd "$root" && export LC_ALL=C && ! find . -type l -print -quit | grep -q . && find . -type f ! -name '._*' -print0 | sort -z | while IFS= read -r -d '' path; do sha256sum "$path"; done) >"$output"
          }
          canonical_manifest "$flutter_root" "$local_manifest"
          canonical_manifest "$remote_root" "$remote_manifest"
          if ! cmp --silent "$local_manifest" "$remote_manifest"; then
            local_count="$(wc -l <"$local_manifest" | tr -d '[:space:]')"
            remote_count="$(wc -l <"$remote_manifest" | tr -d '[:space:]')"
            echo "pub.dev archive contents differ (local_files=$local_count remote_files=$remote_count)." >&2
            diff -u "$local_manifest" "$remote_manifest" | sed -n '1,80p' >&2 || true
            exit 1
          fi
          exit 0
